services:

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - "banking-network"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - "banking-network"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    command: start-dev
    restart: always
    ports:
      - "7080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks:
      - "banking-network"

  config-server:
    image: hridmitrov/config-server:s14
    container_name: config-server
    restart: always
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"

  eureka-server:
    image: hridmitrov/eureka-server:s14
    container_name: eureka-server
    restart: always
    ports:
      - "8070:8070"
    deploy:
      resources:
        limits:
          memory: 1024m
    environment:
      CONFIG_SERVER_URL: http://config-server:8071
    depends_on:
      config-server:
        condition: service_started
    networks:
      - "banking-network"

  accounts-service:
    image: hridmitrov/accounts-service:s14
    container_name: accounts-ms
    restart: always
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  loans-service:
    image: hridmitrov/loans-service:s14
    container_name: loans-ms
    restart: always
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  cards-service:
    image: hridmitrov/cards-service:s14
    container_name: cards-ms
    restart: always
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  gateway-server:
    image: hridmitrov/gateway-server:s14
    container_name: gateway-server
    restart: always
    ports:
      - "8072:8072"
    deploy:
      resources:
        limits:
          memory: 1024m
    networks:
      - "banking-network"
    environment:
      CONFIG_SERVER_URL: http://config-server:8071
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8070/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs
    depends_on:
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started

  message:
    image: hridmitrov/message:s14
    container_name: message-ms
    restart: always
    environment:
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:29092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - "banking-network"

volumes:
  keycloak-data:
    external: true
    name: accounts-service_keycloak-data
  redis-data:

networks:
  banking-network:
    driver: bridge
