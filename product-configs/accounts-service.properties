server.port=8080

spring.datasource.url=jdbc:h2:mem:accounts_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never

build.version=3.0

accounts.message=Bank accounts related local APIs
accounts.contactDetails.name=John Doe - Developer
accounts.contactDetails.email=john@example.com
accounts.onCallSupport=(222) 222-333,(222) 222-444

management.endpoints.web.exposure.include=*